# Weekly update pull requests for Go modules, GitHub Actions (pinned to
# commit SHAs) and the Dockerfile base images (pinned by digest).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      prometheus:
        patterns: ["github.com/prometheus/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
