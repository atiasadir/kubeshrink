version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unparam
    - revive
  settings:
    errcheck:
      # Writing to stdout/stderr: a failed write has nowhere better to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        # Every package and exported identifier has a doc comment.
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
  exclusions:
    rules:
      # Test builders keep explicit parameters for readability.
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/atiasadir/kubeshrink
