apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeshrink.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeshrink.labels" . | nindent 4 }}
spec:
  # One replica: each replica would scan the whole cluster on its own.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeshrink.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeshrink.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubeshrink.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeshrink
          image: {{ include "kubeshrink.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:{{ .Values.serve.port }}
            - --interval={{ .Values.serve.interval }}
            - --node-autoscaler={{ .Values.serve.nodeAutoscaler }}
            {{- with .Values.serve.timeout }}
            - --timeout={{ . }}
            {{- end }}
            {{- with .Values.serve.poolLabels }}
            - --pool-labels={{ join "," . }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.serve.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
