# Synthetic workloads for trying live mode on a throwaway local cluster
# (kind, minikube or Docker Desktop). Never apply this to a shared cluster.
#
#   kubectl --context docker-desktop apply -f examples/local-demo/workloads.yaml
#   kubeshrink explain nodes --context docker-desktop
#   kubectl --context docker-desktop delete namespace kubeshrink-demo
apiVersion: v1
kind: Namespace
metadata:
  name: kubeshrink-demo
---
# Two replicas held by an HPA floor of 2, with a PDB that allows no disruption.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kubeshrink-demo
  annotations:
    downscaler/downtime-replicas: "0"
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: kubeshrink-demo
spec:
  minAvailable: 2
  selector: {matchLabels: {app: api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: kubeshrink-demo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
---
# A hand-started pod with scratch space and a Karpenter do-not-disrupt annotation.
apiVersion: v1
kind: Pod
metadata:
  name: scratchpad
  namespace: kubeshrink-demo
  annotations:
    karpenter.sh/do-not-disrupt: "true"
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources: {requests: {cpu: 10m, memory: 16Mi}}
  volumes:
    - name: scratch
      emptyDir: {}
