# Synthetic example: four teams share a small Karpenter cluster and its
# packing is low. Every name here is made up.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Node
    metadata:
      name: general-a
      labels: {karpenter.sh/nodepool: general, kubernetes.io/hostname: general-a, topology.kubernetes.io/zone: zone-1}
    status:
      allocatable: {cpu: "4", memory: 16Gi, pods: "110"}
  - apiVersion: v1
    kind: Node
    metadata:
      name: general-b
      labels: {karpenter.sh/nodepool: general, kubernetes.io/hostname: general-b, topology.kubernetes.io/zone: zone-2}
    status:
      allocatable: {cpu: "4", memory: 16Gi, pods: "110"}
  - apiVersion: v1
    kind: Node
    metadata:
      name: general-c
      labels: {karpenter.sh/nodepool: general, kubernetes.io/hostname: general-c, topology.kubernetes.io/zone: zone-3}
    status:
      allocatable: {cpu: "4", memory: 16Gi, pods: "110"}
  - apiVersion: v1
    kind: Node
    metadata:
      name: ml-a
      labels: {karpenter.sh/nodepool: ml, kubernetes.io/hostname: ml-a, topology.kubernetes.io/zone: zone-1, team: ml}
    spec:
      taints: [{key: dedicated, value: ml, effect: NoSchedule}]
    status:
      allocatable: {cpu: "8", memory: 32Gi, pods: "110"}
  - apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata: {name: general}
    spec:
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 1m
        budgets: [{nodes: "10%"}]
      limits: {cpu: "64"}
  - apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata: {name: ml}
    spec:
      disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 30s}
  - apiVersion: karpenter.sh/v1
    kind: NodeClaim
    metadata: {name: general-a-x1}
    status: {nodeName: general-a, conditions: [{type: Consolidatable, status: "True"}]}
  - apiVersion: karpenter.sh/v1
    kind: NodeClaim
    metadata: {name: general-b-x2}
    status: {nodeName: general-b, conditions: [{type: Consolidatable, status: "True"}]}
  - apiVersion: karpenter.sh/v1
    kind: NodeClaim
    metadata: {name: general-c-x3}
    status: {nodeName: general-c, conditions: [{type: Consolidatable, status: "False", lastTransitionTime: "2026-11-21T02:59:30Z"}]}
  - apiVersion: karpenter.sh/v1
    kind: NodeClaim
    metadata: {name: ml-a-x4}
    status: {nodeName: ml-a, conditions: [{type: Consolidatable, status: "True"}]}
