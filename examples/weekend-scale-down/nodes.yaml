# Synthetic example: a weekend after replicas were scaled down, yet all four
# nodes are still running. Every name here is made up.
# Exported as a kubectl-style List to show that format is supported.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Node
    metadata:
      name: node-a
      labels: {pool: general}
    status:
      allocatable: {cpu: "4", memory: 16Gi, pods: "110"}
  - apiVersion: v1
    kind: Node
    metadata:
      name: node-b
      labels: {pool: general}
    status:
      allocatable: {cpu: "4", memory: 16Gi, pods: "110"}
  - apiVersion: v1
    kind: Node
    metadata:
      name: node-c
      labels: {pool: general, accelerator: gpu-a}
    status:
      allocatable: {cpu: "4", memory: 16Gi, pods: "110"}
  - apiVersion: v1
    kind: Node
    metadata:
      name: node-d
      labels: {pool: general}
    status:
      allocatable: {cpu: "4", memory: 16Gi, pods: "110"}
