# Synthetic pods, one YAML document each.
# A node-exporter DaemonSet pod runs on every node.
apiVersion: v1
kind: Pod
metadata:
  name: node-exporter-a
  namespace: monitoring
  ownerReferences: [{kind: DaemonSet, name: node-exporter, controller: true}]
spec:
  nodeName: node-a
  containers: [{name: exporter, resources: {requests: {cpu: 100m, memory: 128Mi}}}]
status: {phase: Running}
---
apiVersion: v1
kind: Pod
metadata:
  name: node-exporter-b
  namespace: monitoring
  ownerReferences: [{kind: DaemonSet, name: node-exporter, controller: true}]
spec:
  nodeName: node-b
  containers: [{name: exporter, resources: {requests: {cpu: 100m, memory: 128Mi}}}]
status: {phase: Running}
---
apiVersion: v1
kind: Pod
metadata:
